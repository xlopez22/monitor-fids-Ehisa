<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0164ff">
  <meta name="robots" content="noindex">
  <title>Acceso · FIDS Monitor</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="loginBody">
  <div class="loginBg" aria-hidden="true">
    <video id="loginVideo" class="loginVideo" autoplay muted loop playsinline preload="auto" poster="img/login-bg.jpg">
      <source src="img/login-bg.mp4" type="video/mp4">
    </video>
  </div>

  <button type="button" class="themeToggle loginTheme" data-theme-toggle aria-pressed="false" aria-label="Cambiar a tema oscuro">
    <svg class="themeIconMoon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <svg class="themeIconSun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <main class="loginStage">
    <div class="loginWrap">
      <section class="loginCard" aria-labelledby="loginTitle">
        <div class="loginLogoWrap">
          <img class="logoLight" src="img/ehisa-logo.png" alt="EHISA">
          <img class="logoDark" src="img/ehisa-logo-negative.png" alt="EHISA">
        </div>

        <div class="loginFormWrap">
          <h1 id="loginTitle">FIDS Monitor</h1>
          <form id="loginForm">
            <p id="loginErr" class="formErr" role="alert" hidden></p>
            <div class="loginField">
              <label for="password">Contraseña <span class="req" aria-hidden="true">*</span></label>
              <div class="pwWrap">
                <input id="password" type="password" name="password" autocomplete="current-password" placeholder="••••••••" required autofocus>
                <button type="button" class="eyeBtn" id="togglePw" aria-controls="password" aria-pressed="false" aria-label="Mostrar contraseña">
                  <svg class="eyeOff" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17.3 17.3 0 0 1-3.2 4.1"/><path d="M6.5 6.5A17.6 17.6 0 0 0 2 12s3.5 7 10 7a10.6 10.6 0 0 0 5.5-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                  <svg class="eyeOn" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <button type="submit" class="primary loginSubmit" id="loginBtn">Iniciar sesión</button>
          </form>
        </div>
      </section>

      <p class="loginCopyright">© <span id="year">2026</span> EHISA. Todos los derechos reservados.</p>
    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
